# Test-Deploy auf Netlify: Vorschau-Bau (noindex, Platzhalter sichtbar) mit allen Sicherheits-Headern in dist/_headers.
# Netlify setzt URL auf die Hauptadresse der Site (Canonicals und Sitemap zeigen dorthin); ausgeliefert wird nur dist/.
# Vor einem echten Release: docs/HOSTER-CHECKLISTE.md.
[build]
  command = "node bau/bauen.mjs --ziel=netlify --basis=$URL"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlifys Geheimnis-Scan durchsucht den ganzen Checkout; die Wettbewerber-Rohdaten enthalten einen fremden,
  # öffentlichen Google-Schlüssel und würden den Deploy abbrechen. Ausgeliefert werden sie nie (nur dist/), und
  # der Prüfer sicherheit sucht in dist/ selbst nach Schlüsselmustern.
  SECRETS_SCAN_OMIT_PATHS = "Richter Schlüsseldienst/,Schlüsseldienst Adam/"
